[project]
name = "transcriber"
version = "0.1.0"
description = "Auto-record Zoom and Google Meet meetings"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40.0",
    "faster-whisper>=1.2.1",
    "pillow>=12.1.1",
    "psutil>=7.2.2",
    "pynput>=1.7.0",
    "pystray>=0.19.5",
    "sounddevice>=0.5.0",
]

[project.scripts]
transcriber = "monitor:main"
dictate = "dictate:main"
