[project]
name = "transcriber"
version = "0.1.0"
description = "Auto-record Zoom and Google Meet meetings"
requires-python = ">=3.13"
dependencies = [
    "evdev>=1.9.2",
    "openai-whisper>=20240930",
    "pynput>=1.7.0",
    "sounddevice>=0.5.0",
    "torch==2.11.0+rocm7.2",
]

[project.scripts]
transcriber = "monitor:main"
dictate = "dictate:main"

[tool.uv.sources]
torch = [{ index = "pytorch-rocm" }]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
