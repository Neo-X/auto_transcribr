[project]
name = "transcriber"
version = "0.1.0"
description = "Auto-record Zoom and Google Meet meetings"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "evdev>=1.9.2",
    "librosa>=1.0.0",
    "openai-whisper>=20240930",
    "protobuf>=7.36.2",
    "pynput>=1.7.0",
    "sentencepiece>=0.2.2",
    "sounddevice>=0.5.0",
    "torch==2.11.0+rocm7.2",
    "torchaudio==2.11.0+rocm7.2",
    "transformers>=5.4",
]

[project.scripts]
transcriber = "monitor:main"
dictate = "dictate:main"

[tool.uv.sources]
torch = [{ index = "pytorch-rocm" }]
torchaudio = [{ index = "pytorch-rocm" }]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"

[tool.uv]
# openai-whisper pulls in the CUDA `triton`, which installs into the same `triton/`
# package directory as ROCm torch's `triton-rocm` and corrupts it (breaks transformers
# imports such as CohereAsr). Exclude it; triton-rocm provides `triton` on this machine.
override-dependencies = ["triton; sys_platform == 'never'"]
